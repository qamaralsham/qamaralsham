<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قمر الشام 🌙 - البروفايل</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #030108; 
            min-height: 100vh; 
            color: white; 
            margin: 0;
            padding: 20px;
        }
        
        .profile-card {
            max-width: 500px;
            margin: 0 auto;
            background: linear-gradient(160deg, rgba(27, 10, 58, 0.4), rgba(11, 4, 23, 0.6), rgba(3, 1, 8, 0.85));
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .cover {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #35136b, #190938, #070312);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            margin-bottom: 60px;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            overflow: hidden;
            margin: -50px auto 0;
            background: #111;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .role {
            color: #ffd700;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }

        .username {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }

        .bio {
            color: #90caf9;
            font-size: 14px;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 10px 20px;
            color: #b0bec5;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .tab-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }

        .tab-content {
            margin-top: 20px;
            background: rgba(10, 5, 20, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: right;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #ffab91;
            font-weight: bold;
            font-size: 14px;
        }

        .info-value {
            color: #f1f5f9;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="cover">
            <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600" alt="غلاف">
        </div>

        <div class="avatar">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200" alt="صورة">
        </div>

        <div class="role">👑 Owner</div>
        <h1 class="username" id="profile-username">قمر الشام</h1>
        <p class="bio" id="profile-bio">@damascus_moon</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('settings')">إعدادات الحساب</button>
            <button class="tab-btn" onclick="showTab('appearance')">المظهر</button>
            <button class="tab-btn" onclick="showTab('info')">المعلومات</button>
        </div>

        <div id="settings" class="tab-content active">
            <div class="info-row">
                <span class="info-label">البريد الإلكتروني</span>
                <span class="info-value">damascus.moon@gmail.com</span>
            </div>
            <div class="info-row">
                <span class="info-label">رقم الهاتف</span>
                <span class="info-value">+963 999 000 000</span>
            </div>
            <div class="info-row">
                <span class="info-label">لغة الحساب</span>
                <span class="info-value">العربية</span>
            </div>
        </div>

        <div id="appearance" class="tab-content">
            <div class="info-row">
                <span class="info-label">لون الاسم</span>
                <span class="info-value">أبيض</span>
            </div>
            <div class="info-row">
                <span class="info-label">خط الاسم</span>
                <span class="info-value">Cairo</span>
            </div>
            <div class="info-row">
                <span class="info-label">حركة الاسم</span>
                <span class="info-value">نبض</span>
            </div>
        </div>

        <div id="info" class="tab-content">
            <div class="info-row">
                <span class="info-label">البلد</span>
                <span class="info-value">سوريا - دمشق 🇸🇾</span>
            </div>
            <div class="info-row">
                <span class="info-label">مدة العضوية</span>
                <span class="info-value">منذ 2022</span>
            </div>
        </div>
    </div>

    <script>
        // ====== إظهار التبويبات ======
        function showTab(tabId) {
            // إخفاء كل التبويبات
            document.querySelectorAll('.tab-content').forEach(function(tab) {
                tab.classList.remove('active');
            });
            
            // إظهار التبويب المحدد
            document.getElementById(tabId).classList.add('active');
            
            // تحديث الأزرار
            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.classList.remove('active');
            });
            
            // تفعيل الزر المحدد
            event.target.classList.add('active');
        }

        // ====== قراءة اسم المستخدم من الشات ======
        document.addEventListener('DOMContentLoaded', function() {
            const savedUserName = localStorage.getItem('qamar_user_name');
            if (savedUserName) {
                document.getElementById('profile-username').innerText = savedUserName;
            }
            
            const savedBio = localStorage.getItem('profile_bio');
            if (savedBio) {
                document.getElementById('profile-bio').innerText = savedBio;
            }
        });
    </script>
</body>
</html>
