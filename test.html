<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧪 اختبار الملفات الأساسية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Cairo', sans-serif;
        background: #050508;
        color: #fff;
        padding: 16px;
        direction: rtl;
        min-height: 100vh;
    }
    h1 {
        color: #ffd700;
        font-size: 20px;
        margin-bottom: 6px;
        text-align: center;
    }
    .subtitle {
        color: #888;
        font-size: 12px;
        text-align: center;
        margin-bottom: 18px;
    }
    .summary {
        padding: 14px;
        border-radius: 12px;
        text-align: center;
        margin-bottom: 16px;
        font-weight: 900;
        font-size: 15px;
    }
    .summary.ok { background: rgba(132,204,22,0.15); border: 2px solid #84cc16; color: #a3e635; }
    .summary.fail { background: rgba(255,68,68,0.15); border: 2px solid #ff4444; color: #ff7777; }
    .summary.loading { background: rgba(255,215,0,0.1); border: 2px solid #ffd700; color: #ffd700; }
    .summary .big { font-size: 26px; display: block; margin-bottom: 4px; }

    .section {
        margin-bottom: 14px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,215,0,0.15);
        border-radius: 12px;
        padding: 12px;
    }
    .section-title {
        color: #ffd700;
        font-size: 13px;
        font-weight: 900;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 6px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        font-size: 12.5px;
        line-height: 1.5;
    }
    .item:last-child { border-bottom: none; }
    .item .icon { font-size: 15px; flex-shrink: 0; line-height: 1.5; }
    .item .label { flex: 1; color: #ddd; word-break: break-word; }
    .item .value {
        color: #ffd700;
        font-family: monospace;
        font-size: 11.5px;
        text-align: left;
        direction: ltr;
        word-break: break-all;
        max-width: 45%;
    }
    .item.pass { background: rgba(132,204,22,0.05); }
    .item.pass .icon { color: #84cc16; }
    .item.fail { background: rgba(255,68,68,0.08); }
    .item.fail .icon { color: #ff4444; }
    .item.fail .value { color: #ff7777; }
    .item.warn { background: rgba(255,152,0,0.06); }
    .item.warn .icon { color: #ff9800; }

    .errors-box {
        background: rgba(255,68,68,0.1);
        border: 1px solid #ff4444;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 14px;
        font-family: monospace;
        font-size: 11px;
        color: #ff9999;
        direction: ltr;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 200px;
        overflow-y: auto;
    }

    .actions {
        display: flex;
        gap: 8px;
        margin-top: 18px;
    }
    .btn {
        flex: 1;
        padding: 14px;
        border-radius: 10px;
        border: none;
        font-family: inherit;
        font-weight: 900;
        font-size: 14px;
        cursor: pointer;
    }
    .btn-primary { background: #ffd700; color: #000; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }

    .footer {
        text-align: center;
        color: #555;
        font-size: 10px;
        margin-top: 16px;
        padding-bottom: 20px;
    }
</style>
</head>
<body>

<h1>🧪 اختبار الملفات الأساسية</h1>
<div class="subtitle">المرحلة A — config.js + ranks.js + utils.js</div>

<div id="summary" class="summary loading">
    <span class="big">⏳</span>
    جاري التحميل...
</div>

<div id="errors" class="errors-box" style="display:none;"></div>

<div id="results"></div>

<div class="actions">
    <button class="btn btn-primary" onclick="location.reload()">🔄 إعادة التشغيل</button>
    <button class="btn btn-secondary" onclick="location.href='index.html'">🏠 الرئيسية</button>
</div>

<div class="footer">قمر الشام · نسخة اختبار</div>

<!-- ═══ التقاط الأخطاء ═══ -->
<script>
window.__testErrors = [];
window.__originalConsoleError = console.error;
console.error = function() {
    window.__testErrors.push(Array.from(arguments).map(a => {
        try { return typeof a === 'object' ? JSON.stringify(a) : String(a); }
        catch(e) { return String(a); }
    }).join(' '));
    window.__originalConsoleError.apply(console, arguments);
};

window.addEventListener('error', function(e) {
    window.__testErrors.push('Uncaught: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
});
</script>

<!-- ═══ الملفات الأساسية ═══ -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="ranks.js"></script>
<script src="utils.js"></script>

<script>
/* ═══════════════════════════════════════════════ */
/* محرّك الاختبارات                                */
/* ═══════════════════════════════════════════════ */
function runTest(label, testFn, expectedDisplay) {
    var passed = false;
    var actual = '';
    try {
        actual = testFn();
        passed = actual !== false && actual !== undefined && actual !== null;
        if (typeof actual === 'boolean') passed = actual;
    } catch(e) {
        actual = '❌ ' + e.message;
        passed = false;
    }
    return {
        label: label,
        passed: passed,
        value: passed ? (expectedDisplay || String(actual)) : ('❌ ' + String(actual).substring(0, 60))
    };
}

function renderSection(title, icon, tests) {
    var html = '<div class="section">';
    html += '<div class="section-title">' + icon + ' ' + title + '</div>';
    tests.forEach(function(t) {
        var cls = t.passed ? 'pass' : 'fail';
        var iconHtml = t.passed ? '✅' : '❌';
        html += '<div class="item ' + cls + '">';
        html += '<span class="icon">' + iconHtml + '</span>';
        html += '<span class="label">' + t.label + '</span>';
        html += '<span class="value">' + (t.value || '') + '</span>';
        html += '</div>';
    });
    html += '</div>';
    return html;
}

/* ═══════════════════════════════════════════════ */
/* الاختبارات                                      */
/* ═══════════════════════════════════════════════ */
setTimeout(function() {
    var results = document.getElementById('results');
    var summary = document.getElementById('summary');
    var errorsBox = document.getElementById('errors');
    var html = '';
    var totalTests = 0;
    var passedTests = 0;

    function addSection(title, icon, tests) {
        tests.forEach(function(t) {
            totalTests++;
            if (t.passed) passedTests++;
        });
        html += renderSection(title, icon, tests);
    }

    /* ─── القسم 1: تحميل الملفات ─── */
    addSection('تحميل الملفات', '📦', [
        runTest('config.js محمّل (QAMAR موجود)', function() {
            return typeof QAMAR !== 'undefined' && QAMAR !== null;
        }, 'QAMAR ✓'),
        runTest('ranks.js محمّل (RANKS موجود)', function() {
            return typeof RANKS !== 'undefined' && Object.keys(RANKS).length === 10;
        }, '10 رتب'),
        runTest('utils.js محمّل (showToast موجود)', function() {
            return typeof showToast === 'function';
        }, 'showToast ✓'),
        runTest('Firebase initialized', function() {
            return typeof auth !== 'undefined' && auth !== null && typeof db !== 'undefined' && db !== null;
        }, 'auth + db ✓')
    ]);

    /* ─── القسم 2: getRankLevel موحّد ─── */
    addSection('getRankLevel — موحّد', '🎖️', [
        runTest('window.getRankLevel معرّف', function() {
            return typeof window.getRankLevel === 'function';
        }, 'function ✓'),
        runTest("getRankLevel('King') = 100", function() {
            return getRankLevel('King') === 100;
        }, '100'),
        runTest("getRankLevel('Queen') = 95", function() {
            return getRankLevel('Queen') === 95;
        }, '95'),
        runTest("getRankLevel('User') = 50", function() {
            return getRankLevel('User') === 50;
        }, '50'),
        runTest("getRankLevel('XXX') = 0 (fallback)", function() {
            return getRankLevel('XXX') === 0;
        }, '0')
    ]);

    /* ─── القسم 3: RANKS الأساسية ─── */
    addSection('RANKS — البنية', '👑', [
        runTest('RANKS فيه 10 رتب', function() {
            return Object.keys(RANKS).length === 10;
        }, '10'),
        runTest('RANKS.King موجود', function() {
            return RANKS.King && RANKS.King.level === 100;
        }, 'level 100'),
        runTest('RANKS.User موجود', function() {
            return RANKS.User && RANKS.User.level === 50;
        }, 'level 50'),
        runTest('getRankBadge("King") = 👑', function() {
            return getRankBadge('King') === '👑';
        }, '👑'),
        runTest('getRankBadge("Queen") = 👸', function() {
            return getRankBadge('Queen') === '👸';
        }, '👸')
    ]);

    /* ─── القسم 4: دوال الرتب ─── */
    addSection('دوال الرتب', '🔧', [
        runTest('isKingRank({rank:"King"}) = true', function() {
            return isKingRank({rank: 'King'}) === true;
        }, 'true'),
        runTest('isQueenRank({rank:"Queen"}) = true', function() {
            return isQueenRank({rank: 'Queen'}) === true;
        }, 'true'),
        runTest('isAdmin({rank:"Admin"}) = true', function() {
            return isAdmin({rank: 'Admin'}) === true;
        }, 'true'),
        runTest('isAdmin({rank:"User"}) = false', function() {
            return isAdmin({rank: 'User'}) === false;
        }, 'false'),
        runTest('can({rank:"King"}, "canBan") = true', function() {
            return can({rank: 'King'}, 'canBan') === true;
        }, 'true'),
        runTest('can({rank:"User"}, "canBan") = false', function() {
            return can({rank: 'User'}, 'canBan') === false;
        }, 'false')
    ]);

    /* ─── القسم 5: QAMAR الجديد ─── */
    addSection('QAMAR v3 — الإضافات', '⭐', [
        runTest('QAMAR.DEFAULT_BIO = "❋ نجوم الشام ❋"', function() {
            return QAMAR.DEFAULT_BIO === '❋ نجوم الشام ❋';
        }, '❋ نجوم الشام ❋'),
        runTest('QAMAR.DEFAULT_NAME_SIZE = 26', function() {
            return QAMAR.DEFAULT_NAME_SIZE === 26;
        }, '26'),
        runTest('QAMAR.AVATAR_SIZE = 120', function() {
            return QAMAR.AVATAR_SIZE === 120;
        }, '120'),
        runTest('QAMAR.DEFAULT_AVATAR_FRAMES.King = "gold"', function() {
            return QAMAR.DEFAULT_AVATAR_FRAMES && QAMAR.DEFAULT_AVATAR_FRAMES.King === 'gold';
        }, 'gold'),
        runTest('QAMAR.DEFAULT_AVATAR_FRAMES.Queen = "pink"', function() {
            return QAMAR.DEFAULT_AVATAR_FRAMES.Queen === 'pink';
        }, 'pink'),
        runTest('QAMAR.DEFAULT_AVATAR_FRAMES.User = "gray"', function() {
            return QAMAR.DEFAULT_AVATAR_FRAMES.User === 'gray';
        }, 'gray'),
        runTest('QAMAR.IDENTITY_FIELDS = 18 حقل', function() {
            return Array.isArray(QAMAR.IDENTITY_FIELDS) && QAMAR.IDENTITY_FIELDS.length === 18;
        }, '18'),
        runTest('QAMAR.PROFILE_GLOWS = 12 لون', function() {
            return Array.isArray(QAMAR.PROFILE_GLOWS) && QAMAR.PROFILE_GLOWS.length === 12;
        }, '12'),
        runTest('QAMAR.NAME_BG_COLORS = 24 لون', function() {
            return Array.isArray(QAMAR.NAME_BG_COLORS) && QAMAR.NAME_BG_COLORS.length === 24;
        }, '24'),
        runTest('QAMAR.STORAGE_KEYS.IDENTITY_UPDATED_AT', function() {
            return QAMAR.STORAGE_KEYS.IDENTITY_UPDATED_AT === 'qamar_identity_updated_at';
        }, 'qamar_identity_updated_at'),
        runTest('QAMAR.STORAGE_KEYS.ROOM_PICKER_DONE', function() {
            return QAMAR.STORAGE_KEYS.ROOM_PICKER_DONE === 'qamar_room_picker_done';
        }, 'qamar_room_picker_done')
    ]);

    /* ─── القسم 6: utils.js — الدوال القديمة ─── */
    addSection('utils.js — دوال قديمة', '🛠️', [
        runTest('escapeHtml("<script>") آمن', function() {
            var r = escapeHtml('<script>alert(1)</script>');
            return r.indexOf('<script>') === -1;
        }, 'آمن'),
        runTest('formatTime(now) يعطي وقت', function() {
            var r = formatTime(Date.now());
            return typeof r === 'string' && r.length > 0;
        }, 'وقت'),
        runTest('truncate("Hello World", 5) = "Hello..."', function() {
            return truncate('Hello World', 5) === 'Hello...';
        }, 'Hello...'),
        runTest('isValidEmail("a@b.com") = true', function() {
            return isValidEmail('a@b.com') === true;
        }, 'true'),
        runTest('isValidName("أحمد") = true', function() {
            return isValidName('أحمد') === true;
        }, 'true'),
        runTest('isLink("مرحبا") = false', function() {
            return isLink('مرحبا') === false;
        }, 'false'),
        runTest('isLink("[img:https://x.com/a.jpg]") = false', function() {
            return isLink('[img:https://x.com/a.jpg]') === false;
        }, 'false')
    ]);

    /* ─── القسم 7: utils.js — الدوال الجديدة ─── */
    addSection('utils.js — دوال جديدة (v5)', '✨', [
        runTest('formatTimeShort(now) شكل HH:MM', function() {
            var r = formatTimeShort(Date.now());
            return /^\d{2}:\d{2}$/.test(r);
        }, 'HH:MM'),
        runTest('formatLastSeen(now, "الروم العام") يشمل الغرفة', function() {
            var r = formatLastSeen(Date.now(), 'الروم العام');
            return r.indexOf('الروم العام') !== -1 && r.indexOf('📌') !== -1;
        }, 'تاريخ+وقت+📌'),
        runTest('formatLastSeen(now) بدون غرفة', function() {
            var r = formatLastSeen(Date.now());
            return r.indexOf('📌') === -1 && r.length > 0;
        }, 'تاريخ+وقت فقط'),
        runTest('buildProfileUrl("abc") يعطي رابط', function() {
            var r = buildProfileUrl('abc');
            return r.indexOf('profile.html?uid=abc') !== -1;
        }, 'profile.html?uid=abc'),
        runTest('buildProfileUrl(null, true) = owner', function() {
            var r = buildProfileUrl(null, true);
            return r.indexOf('owner=1') !== -1;
        }, 'owner=1'),
        runTest('extractUserCode("AH·XY3") يشتغل', function() {
            return extractUserCode('مرحبا AH·XY3') === 'AH·XY3';
        }, 'AH·XY3'),
        runTest('extractUserCode("BOT·GUA") يشتغل (بوت)', function() {
            return extractUserCode('السجان BOT·GUA') === 'BOT·GUA';
        }, 'BOT·GUA'),
        runTest('isValidCountry("سوريا") = true', function() {
            return isValidCountry('سوريا') === true;
        }, 'true'),
        runTest('isValidCountry("") = false', function() {
            return isValidCountry('') === false;
        }, 'false'),
        runTest('isValidFamily("الشامي") = true', function() {
            return isValidFamily('الشامي') === true;
        }, 'true')
    ]);

    /* ─── القسم 8: generateUserCode ─── */
    addSection('generateUserCode', '🔑', [
        runTest('generateUserCode("أحمد", "uid1") يعطي كود', function() {
            var r = generateUserCode('أحمد', 'uid1');
            return typeof r === 'string' && r.indexOf('·') !== -1;
        }, 'AX·XXX'),
        runTest('generateUserCode(uid=null) لا يكسر', function() {
            var r = generateUserCode('أحمد', null);
            return typeof r === 'string' && r.indexOf('·') !== -1;
        }, 'لا يكسر')
    ]);

    /* ─── عرض النتائج ─── */
    results.innerHTML = html;

    /* ─── الملخص ─── */
    var percent = Math.round((passedTests / totalTests) * 100);
    if (percent === 100) {
        summary.className = 'summary ok';
        summary.innerHTML = '<span class="big">🎉</span>' +
            'كل الاختبارات نجحت<br>' +
            passedTests + ' / ' + totalTests + ' (' + percent + '%)';
    } else {
        summary.className = 'summary fail';
        summary.innerHTML = '<span class="big">⚠️</span>' +
            'في مشاكل تحتاج مراجعة<br>' +
            passedTests + ' / ' + totalTests + ' (' + percent + '%)';
    }

    /* ─── الأخطاء ─── */
    if (window.__testErrors.length > 0) {
        errorsBox.style.display = 'block';
        errorsBox.textContent = '🚨 أخطاء Console:\n\n' + window.__testErrors.join('\n\n');
    }

    /* ─── Scroll للنتائج ─── */
    summary.scrollIntoView({ behavior: 'smooth', block: 'start' });
}, 1500);

console.log('🧪 _test.html loaded');
</script>

</body>
</html>
